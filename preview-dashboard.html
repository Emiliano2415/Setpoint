<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setpoint — Dashboard Preview v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D1109;
    --bg2: #161C10;
    --bg3: #1a2213;
    --bg4: #1f2918;
    --lime: #6CF20D;
    --lime-5: rgba(108,242,13,0.05);
    --lime-8: rgba(108,242,13,0.08);
    --lime-10: rgba(108,242,13,0.1);
    --lime-15: rgba(108,242,13,0.15);
    --lime-20: rgba(108,242,13,0.2);
    --lime-30: rgba(108,242,13,0.3);
    --lime-60: rgba(108,242,13,0.6);
    --text: #F1F5F9;
    --text-secondary: #CBD5C4;
    --muted: #8B9C7A;
    --muted-dim: #5A6B4E;
    --border: #28351C;
    --border-subtle: #1e2a15;
    --yellow: #EAB308;
    --yellow-10: rgba(234,179,8,0.1);
    --red: #EF4444;
    --red-80: rgba(239,68,68,0.8);
    --red-10: rgba(239,68,68,0.1);
    --green: #22C55E;
    --green-80: rgba(34,197,94,0.8);
    --green-10: rgba(34,197,94,0.1);
    --blue: #3B82F6;
    --blue-10: rgba(59,130,246,0.1);
    --orange: #F97316;
    --orange-10: rgba(249,115,22,0.1);
    --surface: rgba(22,28,16,0.6);
    --surface-hover: rgba(22,28,16,0.8);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; }

  /* ==================== LAYOUT ==================== */
  .app { display: flex; height: 100vh; }

  /* ==================== SIDEBAR ==================== */
  .sidebar {
    width: 220px;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 0;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
    z-index: 20;
  }

  .sidebar-brand {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .sidebar-brand-name {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  .sidebar-brand-name span { color: var(--lime); }
  .sidebar-brand-sub {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted-dim);
    margin-top: 2px;
  }

  .sidebar-section {
    padding: 16px 12px 8px;
  }
  .sidebar-section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted-dim);
    padding: 0 8px;
    margin-bottom: 6px;
  }

  .nav-item {
    width: 100%;
    height: 40px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s;
    color: var(--muted);
    font-size: 13.5px;
    font-weight: 500;
    position: relative;
  }
  .nav-item:hover { background: rgba(255,255,255,0.03); color: var(--text-secondary); }
  .nav-item.active {
    background: var(--lime-10);
    color: var(--lime);
    font-weight: 600;
  }
  .nav-item.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 6px;
    bottom: 6px;
    width: 3px;
    background: var(--lime);
    border-radius: 0 3px 3px 0;
  }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.7; }
  .nav-item.active svg { opacity: 1; }

  .sidebar-spacer { flex: 1; }

  .sidebar-user {
    padding: 16px;
    border-top: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .sidebar-avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: var(--lime-10);
    border: 2px solid var(--lime-20);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700; color: var(--lime);
  }
  .sidebar-user-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .sidebar-user-role { font-size: 10px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .sidebar-logout {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--red-10);
    color: var(--red);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    background: transparent;
    margin-top: 4px;
  }
  .sidebar-logout:hover { background: var(--red-10); }
  .sidebar-logout svg { width: 14px; height: 14px; }

  .sidebar-config {
    padding: 8px 12px 12px;
    border-top: 1px solid var(--border-subtle);
  }

  /* ==================== MAIN AREA ==================== */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* ==================== TOPBAR ==================== */
  .topbar {
    height: 56px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
    flex-shrink: 0;
  }
  .topbar-title {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.3px;
    text-transform: uppercase;
  }
  .topbar-search {
    flex: 1;
    max-width: 500px;
    height: 36px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    color: var(--muted);
    font-size: 13px;
    margin-left: 16px;
  }
  .topbar-search svg { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.5; }
  .topbar-search input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
  }
  .topbar-search input::placeholder { color: var(--muted-dim); }
  .topbar-spacer { flex: 1; }
  .topbar-status {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 500; color: var(--muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .topbar-status .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--lime);
    animation: pulse-dot 2s infinite;
  }
  @keyframes pulse-dot { 0%,100%{opacity:1}50%{opacity:0.4} }

  .topbar-clock {
    font-family: 'Fira Code', monospace;
    font-size: 22px;
    font-weight: 700;
    color: var(--lime);
    letter-spacing: 1px;
  }
  .topbar-date {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
    line-height: 1.2;
  }
  .topbar-icons { display: flex; gap: 8px; }
  .topbar-icon {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.15s;
    color: var(--muted);
  }
  .topbar-icon:hover { background: rgba(255,255,255,0.04); color: var(--text); }
  .topbar-icon svg { width: 18px; height: 18px; }

  .topbar-btn {
    padding: 7px 16px;
    background: var(--lime);
    color: var(--bg);
    font-size: 12px;
    font-weight: 700;
    border-radius: var(--radius-sm);
    border: none;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: filter 0.15s;
  }
  .topbar-btn:hover { filter: brightness(1.1); }

  /* ==================== CONTENT ==================== */
  .content { flex: 1; overflow-y: auto; padding: 0; }
  .content::-webkit-scrollbar { width: 4px; }
  .content::-webkit-scrollbar-track { background: transparent; }
  .content::-webkit-scrollbar-thumb { background: var(--lime-20); border-radius: 4px; }

  /* ==================== SHARED COMPONENTS ==================== */
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .badge-lime { background: var(--lime-10); color: var(--lime); }
  .badge-yellow { background: var(--yellow-10); color: var(--yellow); }
  .badge-red { background: var(--red-10); color: var(--red); }
  .badge-blue { background: var(--blue-10); color: var(--blue); }
  .badge-orange { background: var(--orange-10); color: var(--orange); }
  .badge-muted { background: rgba(139,156,122,0.12); color: var(--muted); }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    font-family: inherit;
  }
  .btn-primary { background: var(--lime); color: var(--bg); font-weight: 700; }
  .btn-primary:hover { filter: brightness(1.1); transform: scale(1.01); }
  .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--lime-30); background: rgba(255,255,255,0.03); }
  .btn-ghost { background: transparent; color: var(--muted); }
  .btn-ghost:hover { color: var(--text); background: rgba(255,255,255,0.03); }
  .btn svg { width: 14px; height: 14px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 20px;
    transition: border-color 0.2s;
  }
  .card:hover { border-color: var(--border); }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .card-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }

  .stat-card {
    background: var(--bg);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 16px;
    text-align: center;
  }
  .stat-value { font-family: 'Fira Code', monospace; font-size: 22px; font-weight: 700; color: var(--lime); }
  .stat-label { font-size: 10px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 10px; font-weight: 600; color: var(--muted-dim); text-transform: uppercase; letter-spacing: 0.8px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  td { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid var(--border-subtle); }
  tr:hover td { background: rgba(255,255,255,0.015); }

  .mono { font-family: 'Fira Code', monospace; }

  .fade-in { animation: fadeIn 0.35s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

  /* ==================== POS SPECIFIC ==================== */
  .pos-layout { display: grid; grid-template-columns: 1fr 360px; gap: 0; height: calc(100vh - 56px); }
  .pos-main { padding: 24px; overflow-y: auto; }
  .pos-main::-webkit-scrollbar { width: 3px; }
  .pos-main::-webkit-scrollbar-thumb { background: var(--lime-20); border-radius: 3px; }

  .pos-tabs {
    display: flex; gap: 8px; margin-bottom: 24px;
  }
  .pos-tab {
    padding: 10px 20px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
  }
  .pos-tab:hover { border-color: var(--lime-20); color: var(--text); }
  .pos-tab.active { background: var(--lime); color: var(--bg); border-color: var(--lime); }

  .product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .product-card {
    background: var(--bg);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: all 0.15s;
    overflow: hidden;
    position: relative;
  }
  .product-card:hover { border-color: var(--lime-20); transform: translateY(-2px); }
  .product-card:active { transform: scale(0.98); }
  .product-img {
    width: 100%;
    height: 140px;
    background: var(--bg3);
    object-fit: cover;
    display: block;
  }
  .product-info { padding: 14px; }
  .product-category {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted-dim);
    margin-bottom: 4px;
  }
  .product-name { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 8px; line-height: 1.3; }
  .product-price {
    font-family: 'Fira Code', monospace;
    font-size: 15px;
    font-weight: 700;
    color: var(--lime);
  }
  .product-price-currency { font-size: 11px; font-weight: 500; color: var(--muted); margin-left: 4px; }

  /* Ticket Panel */
  .ticket-panel {
    background: var(--bg2);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .ticket-header {
    padding: 20px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .ticket-header-row { display: flex; justify-content: space-between; align-items: center; }
  .ticket-title { font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
  .ticket-id { font-family: 'Fira Code', monospace; font-size: 12px; color: var(--muted); }
  .ticket-client {
    display: flex; align-items: center; gap: 10px;
    padding: 12px;
    background: var(--bg);
    border-radius: var(--radius-sm);
    margin-top: 12px;
  }
  .ticket-client-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--lime-8);
    border: 1px solid var(--lime-15);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
  }
  .ticket-client-avatar svg { width: 18px; height: 18px; }
  .ticket-client-info { flex: 1; }
  .ticket-client-name { font-size: 13px; font-weight: 600; }
  .ticket-client-badge { font-size: 10px; font-weight: 700; color: var(--lime); }

  .ticket-items {
    flex: 1;
    overflow-y: auto;
    padding: 12px 20px;
  }
  .ticket-items::-webkit-scrollbar { width: 3px; }
  .ticket-items::-webkit-scrollbar-thumb { background: var(--lime-20); border-radius: 3px; }

  .ticket-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border-subtle);
  }
  .ticket-item-img {
    width: 44px; height: 44px;
    border-radius: var(--radius-sm);
    background: var(--bg3);
    object-fit: cover;
    flex-shrink: 0;
  }
  .ticket-item-details { flex: 1; min-width: 0; }
  .ticket-item-name { font-size: 13px; font-weight: 600; }
  .ticket-item-qty-controls {
    display: flex; align-items: center; gap: 0; margin-top: 4px;
  }
  .qty-btn {
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    transition: all 0.1s;
  }
  .qty-btn:first-child { border-radius: 4px 0 0 4px; }
  .qty-btn:last-child { border-radius: 0 4px 4px 0; }
  .qty-btn:hover { background: var(--lime-10); border-color: var(--lime-20); }
  .qty-value {
    width: 28px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    font-family: 'Fira Code', monospace;
    font-size: 12px;
    font-weight: 600;
  }
  .ticket-item-price {
    font-family: 'Fira Code', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    text-align: right;
    flex-shrink: 0;
  }
  .ticket-item-remove {
    font-size: 10px;
    font-weight: 700;
    color: var(--lime);
    cursor: pointer;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .ticket-item-remove:hover { color: var(--red); }

  .ticket-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
  }
  .ticket-summary-row {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--muted);
    padding: 3px 0;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .ticket-summary-row span:last-child { font-family: 'Fira Code', monospace; color: var(--text); }
  .ticket-summary-row.discount { color: var(--lime); }
  .ticket-summary-row.discount span:last-child { color: var(--lime); }
  .ticket-total-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 10px 0 0;
    margin-top: 6px;
    border-top: 1px solid var(--border);
  }
  .ticket-total-label { font-size: 14px; font-weight: 800; text-transform: uppercase; }
  .ticket-total-value { font-family: 'Fira Code', monospace; font-size: 26px; font-weight: 700; color: var(--lime); }
  .ticket-total-currency { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 4px; }

  .ticket-payment {
    padding: 0 20px 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .payment-btn {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 14px 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    color: var(--text);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .payment-btn:hover { border-color: var(--lime-20); background: var(--lime-5); }
  .payment-btn svg { width: 20px; height: 20px; color: var(--text); }
  .payment-btn-secondary {
    padding: 10px 8px;
    background: transparent;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }
  .payment-btn-secondary:hover { color: var(--text); border-color: var(--border); }

  .ticket-pay-btn {
    margin: 0 20px 20px;
    padding: 16px;
    background: var(--lime);
    color: var(--bg);
    font-size: 15px;
    font-weight: 800;
    text-align: center;
    border-radius: var(--radius-md);
    cursor: pointer;
    border: none;
    transition: filter 0.15s;
    font-family: inherit;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .ticket-pay-btn:hover { filter: brightness(1.08); }

  /* ==================== PISTAS SPECIFIC ==================== */
  .pistas-layout { display: grid; grid-template-columns: 1fr 320px; gap: 0; height: calc(100vh - 56px); }
  .pistas-main { padding: 24px; overflow-y: auto; }
  .pistas-main::-webkit-scrollbar { width: 3px; }
  .pistas-main::-webkit-scrollbar-thumb { background: var(--lime-20); border-radius: 3px; }
  .pistas-sidebar {
    background: var(--bg2);
    border-left: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .pistas-sidebar::-webkit-scrollbar { width: 3px; }
  .pistas-sidebar::-webkit-scrollbar-thumb { background: var(--lime-20); border-radius: 3px; }

  .courts-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .court-card {
    background: var(--bg);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 18px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .court-card:hover { border-color: var(--lime-20); }
  .court-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .court-label { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--muted); }
  .court-timer { font-family: 'Fira Code', monospace; font-size: 28px; font-weight: 700; color: var(--muted-dim); margin-bottom: 12px; letter-spacing: 2px; }
  .court-timer.active { color: var(--lime); }
  .court-timer.warning { color: var(--yellow); }
  .court-timer.critical { color: var(--red); animation: pulse-dot 1s infinite; }

  .court-info-block {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    background: var(--bg2);
    border-radius: var(--radius-sm);
    margin-bottom: 12px;
  }
  .court-info-icon {
    width: 36px; height: 36px;
    border-radius: var(--radius-sm);
    background: var(--lime-8);

<script>
// ==================== CLOCK ====================
function updateClock() {
  const now = new Date();
  const clockEl = document.getElementById('topbarClock');
  const dateEl = document.getElementById('topbarDate');
  if (clockEl) clockEl.textContent = now.toLocaleTimeString('es-MX', { hour12: false });
  if (dateEl) dateEl.textContent = now.toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' });
}
setInterval(updateClock, 1000);

// ==================== NAVIGATION ====================
let currentPage = 'pos';
let activeCategory = 'alimentos';

function switchPage(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  renderTopbar(page);
  renderPage(page);
}

function renderTopbar(page) {
  const topbar = document.getElementById('topbar');
  const configs = {
    pos: { title: 'Ventas (POS)', search: 'Search products, customers (F1)...', right: 'terminal' },
    pistas: { title: 'Gestión de Pistas', search: 'Buscar reserva, socio o pista...', right: 'clock' },
    comandas: { title: 'Comandas', search: 'Buscar comanda o pista...', right: 'terminal' },
    inventario: { title: 'Inventario', search: 'Buscar producto...', right: 'terminal' },
    clientes: { title: 'Clientes (CRM)', search: 'Buscar cliente por nombre o teléfono...', right: 'terminal' },
    caja: { title: 'Caja y Finanzas', search: '', right: 'terminal' },
    empleados: { title: 'Personal', search: 'Buscar empleado...', right: 'terminal' },
    reportes: { title: 'Reportes y Analytics', search: '', right: 'terminal' },
    config: { title: 'Configuración', search: '', right: 'terminal' },
  };
  const cfg = configs[page] || configs.pos;

  let rightHTML = '';
  if (cfg.right === 'clock') {
    rightHTML = `
      <div id="topbarClock" class="topbar-clock">23:14:20</div>
      <div class="topbar-date"><span id="topbarDate">17 marzo, 2026</span></div>
      <div class="topbar-icons">
        <div class="topbar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>
        <div class="topbar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4"/></svg></div>
      </div>`;
  } else {
    rightHTML = `
      <div class="topbar-status"><span class="dot"></span>Terminal 01 Online</div>
      <button class="topbar-btn">Nuevo Turno</button>`;
  }

  topbar.innerHTML = `
    <span class="topbar-title">${cfg.title}</span>
    ${cfg.search ? `<div class="topbar-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" placeholder="${cfg.search}" /></div>` : ''}
    <div class="topbar-spacer"></div>
    ${rightHTML}
  `;
  updateClock();
}

function renderPage(page) {
  const container = document.getElementById('pageContent');
  const pages = { pos: renderPOS, pistas: renderPistas, comandas: renderComandas, inventario: renderInventario, clientes: renderClientes, caja: renderCaja, empleados: renderEmpleados, reportes: renderReportes, config: renderConfig };
  container.innerHTML = (pages[page] || (() => '<div class="page-pad fade-in"><p style="color:var(--muted)">Módulo en desarrollo</p></div>'))(page);
}

// ==================== POS ====================
function renderPOS() {

    { id: 'alimentos', label: 'Alimentos', products: [
      { name: 'Espresso Doble', cat: 'Cafetería', sub: 'Hot', price: 45, img: 'img-coffee' },

      { name: 'Bote Bolas Head Pro', cat: 'Bolas/Grips', sub: 'Consumable', price: 165, img: 'img-balls' },
    ]},
    { id: 'bebidas', label: 'Bebidas', products: [
      { name: 'Café Americano', cat: 'Cafetería', sub: 'Hot', price: 38, img: 'img-coffee' },
      { name: 'Jugo Natural', cat: 'Bebidas', sub: 'Fresh', price: 55, img: 'img-drink' },
      { name: 'Isotónica 600ml', cat: 'Bebidas', sub: 'Sport', price: 50, img: 'img-drink' },

    { id: 'alquiler', label: 'Alquiler de Equipo', products: [

      { name: 'Pala Pro', cat: 'Alquiler', sub: 'Advanced', price: 120, img: 'img-paddle' },
      { name: 'Kit Completo', cat: 'Alquiler', sub: 'Bundle', price: 180, img: 'img-rental' },
      { name: 'Muñequeras x2', cat: 'Alquiler', sub: 'Accessory', price: 20, img: 'img-grip' },
    ]},
  ];

  const cat = categories.find(c => c.id === activeCategory) || categories[0];

  return `<div class="pos-layout fade-in">
    <div class="pos-main">
      <div class="pos-tabs">
        ${categories.map(c => `<div class="pos-tab ${c.id === activeCategory ? 'active' : ''}" onclick="activeCategory='${c.id}';renderPage('pos')">${c.label}</div>`).join('')}
      </div>
      <div class="product-grid">
        ${cat.products.map(p => `
          <div class="product-card">
            <div class="product-img ${p.img}"></div>
            <div class="product-info">
              <div class="product-category">${p.cat} / ${p.sub}</div>
              <div class="product-name">${p.name}</div>
